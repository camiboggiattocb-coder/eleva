  *{box-sizing:border-box;font-family:'Poppins','Helvetica Neue',Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  html,body{margin:0;padding:0;background:#fff;color:#1c1c1c;}

  .doc-sub{font-size:12px;color:#8a8a8a;margin-top:4px;letter-spacing:1px;}
  .rule{height:2px;background:#141414;width:64px;margin:12px auto 0;}

  .kv span{color:#6b6b6b;} .kv b{color:#1c1c1c;font-weight:600;text-align:right;}
  ol{font-size:12.5px;color:#333;padding-left:18px;margin:3px 0;} ol li{margin:3px 0;}
  p{font-size:12.5px;line-height:1.45;color:#333;margin:6px 0;}
  .bar{height:12px;background:#ededed;border-radius:8px;overflow:hidden;margin:10px 0 4px;}
  .bar>i{display:block;height:100%;background:#141414;}
  .steps{margin-top:8px;}
  .step{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;}
  .step .dot{width:20px;height:20px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:0 0 auto;}

  table.tb{width:100%;border-collapse:collapse;margin:6px 0 4px;font-size:12px;}

  .tot{display:flex;justify-content:space-between;font-size:14px;font-weight:700;padding:10px 2px 0;border-top:2px solid #141414;margin-top:4px;}

  .heart{color:#141414;}
  .contact{font-size:11px;color:#9a9a9a;margin-top:8px;letter-spacing:.5px;}
