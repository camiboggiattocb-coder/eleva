  .kv{display:flex;justify-content:space-between;gap:16px;font-size:13px;padding:5px 0;border-bottom:1px solid #f2f2f2;}
  .kv span{color:#6b6b6b;} .kv b{color:#1c1c1c;font-weight:600;text-align:right;}
  ol{font-size:12.5px;color:#333;padding-left:18px;margin:3px 0;} ol li{margin:3px 0;}
  p{font-size:12.5px;line-height:1.45;color:#333;margin:6px 0;}
  .bar{height:12px;background:#ededed;border-radius:8px;overflow:hidden;margin:10px 0 4px;}
  .bar>i{display:block;height:100%;background:#141414;}
  .steps{margin-top:8px;}
  .step{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;}
  .step .dot{width:20px;height:20px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:0 0 auto;}

  .step.todo{color:#a3a3a3;} .step.curr{font-weight:600;}
  .msg{background:#f4f4f5;border-left:4px solid #141414;border-radius:0 8px 8px 0;padding:14px 16px;font-size:14px;font-weight:500;margin:16px 0;color:#1c1c1c;}
  table.tb{width:100%;border-collapse:collapse;margin:6px 0 4px;font-size:12px;}
  table.tb th{background:#141414;color:#fff;text-align:left;padding:7px 10px;font-weight:600;letter-spacing:.3px;}
  table.tb td{padding:7px 10px;border-bottom:1px solid #eee;color:#333;}
  table.tb tr:last-child td{border-bottom:none;}
  table.tb td.r,table.tb th.r{text-align:right;}
  .tot{display:flex;justify-content:space-between;font-size:14px;font-weight:700;padding:10px 2px 0;border-top:2px solid #141414;margin-top:4px;}
  .firma{margin-top:22px;font-size:13px;color:#333;}
  .thanks{margin-top:22px;text-align:center;break-inside:avoid;}
  .thanks .r2{height:1px;background:#e2e2e2;margin-bottom:14px;}
  .gracias{font-size:16px;letter-spacing:6px;font-weight:600;color:#141414;}
  .contact{font-size:11px;color:#9a9a9a;margin-top:8px;letter-spacing:.5px;}
  @page{size:A4;margin:10mm;}
  @media print{
    .sheet{padding:6px 32px 6px;max-width:none;}

    .firma{margin-top:18px;} .thanks{margin-top:16px;}
  }
